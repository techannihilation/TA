name: Terraform regression tests

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        lua: [lua5.1, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.lua }}
      - name: Run terraform regression suite
        run: ${{ matrix.lua }} tests/terraform/run.lua
